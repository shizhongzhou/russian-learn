name: Breed cut-out
on:
  workflow_dispatch:
    inputs:
      key: { description: "decryption key", required: true }
jobs:
  cut:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { part: ["cat", "dog"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cut
        shell: bash
        env: { KEY: "${{ github.event.inputs.key }}" }
        run: |
          echo "::add-mask::$KEY"
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel "rembg[cpu]==2.0.67" pillow numpy scipy
          curl -sSL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          mkdir all src && openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:$KEY -in art/pet-src/breeds.tar.enc | tar -x -C all
          cp all/${{ matrix.part }}*.png src/
          if ! python scripts/matte_imgs.py src out > log.txt 2>&1; then tail -15 log.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          echo "::notice::$(ls out | wc -l) files $(du -sh out | cut -f1)"
          python -c "import json;d=json.load(open('out/sizes.json'));print('::notice::'+' '.join(f'{k}:{len(v)}' for k,v in sorted(d.items())))"
      - uses: actions/upload-artifact@v4
        with: { name: "breeds-${{ matrix.part }}", path: out, retention-days: 5 }
  publish:
    needs: cut
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "breeds-*", path: incoming, merge-multiple: true }
      - name: Commit to pet-art branch
        shell: bash
        run: |
          git config user.name "pet-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin pet-art || true
          if git rev-parse -q --verify origin/pet-art >/dev/null; then git checkout -q -B pet-art origin/pet-art; else git checkout -q --orphan pet-art; git rm -rqf . ; fi
          mkdir -p breeds && cp -r incoming/* breeds/
          git add breeds && git commit -qm "breed cut-outs" && git push -q origin pet-art
          echo "::notice::published $(find breeds -type f | wc -l) files"
