name: Pet cut-out
# Decrypts art/pet-src/<pet>.tar.enc (key passed as an input, masked) and cuts the pet out of every video.
on:
  workflow_dispatch:
    inputs:
      key: { description: "decryption key", required: true }
      pet: { description: "source pack name", required: true, default: "orange" }
      fps: { description: "frames per second", required: false, default: "24" }
jobs:
  list:
    runs-on: ubuntu-latest
    outputs: { files: "${{ steps.l.outputs.files }}" }
    steps:
      - uses: actions/checkout@v4
      - id: l
        env: { KEY: "${{ github.event.inputs.key }}" }
        run: |
          echo "::add-mask::$KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:$KEY -in art/pet-src/${{ github.event.inputs.pet }}.tar.enc | tar -t | grep mp4 | sed 's#^\./##' | jq -R . | jq -cs . > f.json
          echo "files=$(cat f.json)" >> $GITHUB_OUTPUT
  cut:
    needs: list
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { file: "${{ fromJSON(needs.list.outputs.files) }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Matte
        env: { KEY: "${{ github.event.inputs.key }}" }
        shell: bash
        run: |
          echo "::add-mask::$KEY"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "rembg[cpu]==2.0.67" pillow numpy
          mkdir src && openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:$KEY -in art/pet-src/${{ github.event.inputs.pet }}.tar.enc | tar -x -C src
          f="${{ matrix.file }}"; n="${f%.mp4}"
          ls -la src | head
          if ! python scripts/matte.py "src/$f" "out/$n" ${{ github.event.inputs.fps }} 420 > log.txt 2>&1; then
            tail -15 log.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          echo "::notice::$n $(tail -1 log.txt)"
          rm -rf out/$n/raw
      - uses: actions/upload-artifact@v4
        with: { name: "cut-${{ strategy.job-index }}", path: out, retention-days: 5 }
  publish:
    needs: cut
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "cut-*", path: incoming, merge-multiple: true }
      - name: Commit to pet-art branch
        shell: bash
        run: |
          git config user.name "pet-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin pet-art || true
          if git rev-parse -q --verify origin/pet-art >/dev/null; then git checkout -q -B pet-art origin/pet-art; else git checkout -q --orphan pet-art; git rm -rqf . ; fi
          mkdir -p anim && cp -r incoming/* anim/
          git add anim && git commit -qm "orange cat clips" && git push -q origin pet-art
          echo "::notice::published $(find anim -type f | wc -l) files"
