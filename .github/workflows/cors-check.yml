name: CORS check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://maomao-eyu-d9g3u5l5rd2092a1a-1517834973.tcloudbaseapp.com/audio
          out=""
          for S in ef/ef8d9fa8be9d1ed6 6a/6a5b39c90e1d0ebb cc/cc3ec67fd12d1467 ef/ef08c5a6ccf09784 00/0000000000000000; do
            out="$out | $S $(curl -s -o /dev/null -w '%{http_code} %{size_download}B %{content_type} %{time_total}s' $B/$S.mp3)"
          done
          echo "::notice::AUDIO $out"
