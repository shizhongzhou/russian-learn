name: Upload web to CloudBase
# Pushes the web app zip to a short-lived pre-signed CloudBase upload URL (given as a manual input).
on:
  workflow_dispatch:
    inputs:
      url: { description: "pre-signed upload URL", required: true }
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip and upload
        env: { URL: "${{ github.event.inputs.url }}" }
        run: |
          echo "::add-mask::$URL"
          if [ -f scripts/import-app-assets.py ] && [ -f app-assets.json ]; then
            python3 scripts/import-app-assets.py
          fi
          mkdir -p z/dist
          cp index.html *.js *.css manifest.webmanifest z/dist/
          cp -R data icons img z/dist/
          for directory in vendor models audio; do
            if [ -d "$directory" ]; then cp -R "$directory" z/dist/; fi
          done
          rm -f z/dist/sw.js
          echo '{"name":"maomao","version":"1.0.0"}' > z/package.json
          (cd z && zip -qr ../web.zip .)
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X PUT -H "Content-Type: application/zip" --data-binary @web.zip "$URL")
          echo "::notice::upload HTTP $code size $(du -h web.zip | cut -f1) $(tr -d "\n" < resp.txt | grep -o "<Code>[^<]*</Code>\|<Message>[^<]*</Message>" | tr "\n" " ")"; [ "$code" = 200 ]
