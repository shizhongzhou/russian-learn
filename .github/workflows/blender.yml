name: Blender · 小橘 3D
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (quick stills) or all (every frame + .blend/.glb)"
        default: preview
  push:
    paths: ["art/blender/xiaoju.py"]
permissions:
  contents: write
concurrency: { group: blender, cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with: { path: blender, key: blender-4.2.3 }
      - name: Download Blender 4.2 LTS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          mkdir blender && tar -xf b.tar.xz -C blender --strip-components=1
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 >/dev/null
      - name: Render
        run: |
          MODE="${{ github.event.inputs.mode }}"; MODE="${MODE:-preview}"
          if git log -1 --pretty=%B | grep -q '\[blender all\]'; then MODE=all; fi
          echo "MODE=$MODE" >> $GITHUB_ENV
          ./blender/blender -b -P art/blender/xiaoju.py -- "$PWD/art/blender/renders/$MODE" "$MODE" > blender.log 2>&1 || true
          grep -E "Error|Traceback|DONE|line [0-9]+" blender.log | tail -40
          if [ ! -f art/blender/renders/$MODE/meta.json ]; then
            grep -E -A3 "Error|Traceback|File \"" blender.log | tail -30 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
      - name: Commit renders
        run: |
          git config user.name "blender-bot"; git config user.email "actions@users.noreply.github.com"
          git add art/blender/renders
          git commit -qm "Blender renders ($MODE) [skip ci]" || exit 0
          git pull -q --rebase && git push -q
