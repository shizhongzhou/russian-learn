name: Cloud smoke test
# Opens the app in a headless browser, lets it sign in as a guest and calls the cloud function.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloud.js", "cloud-config.js", "social.js", "cloud/smoke.js", ".github/workflows/cloud-smoke.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        origin: ["localhost:8080"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node cloud/smoke.js
