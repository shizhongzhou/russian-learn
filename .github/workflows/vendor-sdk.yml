name: Vendor CloudBase SDK
# Downloads the CloudBase web SDK into vendor/ so the app (and the native builds) load it locally.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/vendor-sdk.yml"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p vendor
          V=3.10.4
          curl -fsSL -o vendor/cloudbase.full.js "https://static.cloudbase.net/cloudbase-js-sdk/$V/cloudbase.full.js" || { V=latest; curl -fsSL -o vendor/cloudbase.full.js "https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"; }
          echo "/* CloudBase JS SDK $V — https://static.cloudbase.net/cloudbase-js-sdk/$V/cloudbase.full.js */" > vendor/CLOUDBASE_SDK_VERSION.txt
          ls -la vendor; echo "::notice::vendored cloudbase sdk $V ($(wc -c < vendor/cloudbase.full.js) bytes)"
          git config user.name "sdk-bot"; git config user.email "actions@users.noreply.github.com"
          git add vendor && git commit -qm "Vendor CloudBase JS SDK $V" && git pull -q --rebase && git push -q || echo "no change"
