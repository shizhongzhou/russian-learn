name: City photos
on: { workflow_dispatch: {} }
jobs:
  get:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - shell: bash
        run: |
          pip install -q pillow
          python scripts/city_photos.py /tmp/cities 2>&1 | tail -20 | while IFS= read -r l; do echo "::notice::$l"; done
          git config user.name "pet-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin pet-art; git checkout -q -B pet-art origin/pet-art
          rm -rf cities && cp -r /tmp/cities cities && git add cities && git commit -qm "city photos" && git push -q origin pet-art
