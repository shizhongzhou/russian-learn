name: Probe classics on Wikisource
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/classics_probe.py scripts/classics_list.json /tmp/probe.json
      - name: publish to probe branch
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan probe && git rm -rfq . && cp /tmp/probe.json probe.json && git add probe.json && git commit -qm probe && git push -f origin probe
