name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Copy the website into the app
        run: bash scripts/prepare-web.sh

      - name: Create the iOS project
        run: |
          npx cap add ios --packagemanager SPM
          bash scripts/patch-ios.sh
          npx cap sync ios
          ls ios/App

      - name: Package a self-contained Xcode project (no npm / CocoaPods / network needed)
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" | tail -5
          echo "::notice::$(find "$RUNNER_TEMP/spm" -maxdepth 3 | head -30 | tr '\n' ' ')"
          echo "::notice::$(find "$RUNNER_TEMP/spm" -name '*.xcframework' -maxdepth 6 | tr '\n' ' ')"
          echo "::notice::$(cat "$RUNNER_TEMP"/spm/checkouts/capacitor-swift-pm/Package.swift | tr '\n' ' ' | cut -c1-900)"
          cd ../..
          rm -rf /tmp/pk && mkdir -p /tmp/pk/MaoMao-Xcode
          python3 scripts/pack-xcode.py . "$RUNNER_TEMP/spm" /tmp/pk/MaoMao-Xcode > /tmp/pack.log 2>&1 || { echo "::error::pack failed: $(tail -8 /tmp/pack.log | tr '\n' ' ')"; exit 1; }
          printf '用 Xcode 打开 native/ios/App/App.xcodeproj\n然后：Signing & Capabilities → Team 选你的 Apple ID → 选设备 → ▶\n' > /tmp/pk/MaoMao-Xcode/打开方法.txt
          (cd /tmp/pk && zip -qry "$GITHUB_WORKSPACE/native/MaoMao-Xcode.zip" MaoMao-Xcode)
          ls -la MaoMao-Xcode.zip

      - name: Build (unsigned) from the packed project
        run: |
          cd /tmp/pk/MaoMao-Xcode/native/ios/App
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm2" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee /tmp/b.log | tail -30 || { grep -E "error:|Missing package" /tmp/b.log | head -20 | sed "s/^/::error::/"; exit 1; }
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf "$RUNNER_TEMP/Payload" && mkdir -p "$RUNNER_TEMP/Payload" && cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/native/MaoMaoRussian.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/native/MaoMaoRussian.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: MaoMaoRussian-ipa
          path: native/MaoMaoRussian.ipa

      - name: Publish to the "ios-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --title "猫猫俄语通 iOS 安装包" --notes "自动构建的未签名 iOS 安装包（.ipa）。用 Sideloadly / AltStore 等工具配合自己的 Apple ID 签名后安装。" --prerelease
          gh release upload ios-latest MaoMaoRussian.ipa MaoMao-Xcode.zip --clobber
          gh release edit ios-latest --notes "自动构建的未签名 iOS 安装包（.ipa），构建 #${{ github.run_number }}，提交 ${GITHUB_SHA::7}。用 Sideloadly / AltStore 等工具配合自己的 Apple ID 签名后安装。"
